[project]
name = "mcp-Server"
version = "0.1.0"
description = "Model Context Protocol (MCP) Server and Client built from scratch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "typing-extensions>=4.10.0",
    "langchain",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "fastmcp>=3.4.7",
    "ipykernel>=7.3.0",
    "langgraph>=1.2.11",
]
